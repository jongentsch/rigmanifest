[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rigmanifest"
version = "0.1.4"
description = "Capability-aware configuration management for programmable amateur radios"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "Jon Gentsch" }]
dependencies = [
    "chirp @ https://github.com/kk7ds/chirp/archive/fa27a491d275f88b452d0488a51b4c85d4f7062a.zip",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.21,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
]

[project.scripts]
rigmanifest = "rigmanifest.cli:app"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rigmanifest"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.package-data]
rigmanifest = ["py.typed"]
