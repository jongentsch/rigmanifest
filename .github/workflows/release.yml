name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify release versions
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib

          tag_version = os.environ["TAG_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as source:
              pyproject_version = tomllib.load(source)["project"]["version"]
          with open("desktop/package.json", encoding="utf-8") as source:
              package_version = json.load(source)["version"]
          with open("desktop/src-tauri/tauri.conf.json", encoding="utf-8") as source:
              tauri_version = json.load(source)["version"]

          versions = {
              "pyproject": pyproject_version,
              "package": package_version,
              "tauri": tauri_version,
          }
          for source, version in versions.items():
              print(f"{source} version: {version}")
              if version != tag_version:
                  raise SystemExit(
                      f"Tag version {tag_version} does not match {source} version {version}."
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={tag_version}\n")
          PY

  windows:
    name: Windows x64 packages
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Build Python environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build Windows packages
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm bundle:windows

      - name: Stage Windows assets
        shell: pwsh
        run: |
          $version = "${{ needs.metadata.outputs.version }}"
          $installer = "desktop/src-tauri/target/release/bundle/nsis/RigManifest_${version}_x64-setup.exe"
          $portable = "dist/portable/RigManifest_${version}_x64-portable.zip"
          $signature = "${installer}.sig"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          foreach ($asset in @($installer, $portable, $signature)) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset was not produced: $asset"
            }
            Copy-Item -LiteralPath $asset -Destination release-assets -Force
          }

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-packages
          path: release-assets/*
          if-no-files-found: error

  linux:
    name: Linux x64 packages
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Build Python environment
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -e ".[dev]"

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm bundle:linux

      - name: Stage Linux assets
        run: |
          version="${{ needs.metadata.outputs.version }}"
          mkdir -p release-assets
          cp "dist/linux/RigManifest_${version}_amd64.deb" release-assets/
          cp "dist/linux/RigManifest_${version}_x86_64.AppImage" release-assets/
          cp "dist/linux/RigManifest_${version}_x86_64.AppImage.sig" release-assets/

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-packages
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [metadata, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create updater metadata and checksums
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["TAG_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]
          base_url = f"https://github.com/{repository}/releases/download/{tag}"
          assets = Path("release-assets")
          windows = f"RigManifest_{version}_x64-setup.exe"
          linux = f"RigManifest_{version}_x86_64.AppImage"
          metadata = {
              "version": version,
              "notes": f"RigManifest {tag}",
              "platforms": {
                  "windows-x86_64": {
                      "url": f"{base_url}/{windows}",
                      "signature": (assets / f"{windows}.sig").read_text().strip(),
                  },
                  "linux-x86_64": {
                      "url": f"{base_url}/{linux}",
                      "signature": (assets / f"{linux}.sig").read_text().strip(),
                  },
              },
          }
          (assets / "latest.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "RigManifest $TAG_NAME"
          fi
